<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Analyzer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a0a; color: #e1e1e1; min-height: 100vh; }

    header { background: #111; border-bottom: 1px solid #1e1e1e; padding: 0.75rem 1.5rem; display: flex; align-items: center; gap: 0.6rem; }
    header h1 { font-size: 1.1rem; font-weight: 600; color: #fff; }
    .header-badge { font-size: 0.65rem; padding: 0.2rem 0.5rem; background: #1a3a1a; color: #4ade80; border-radius: 4px; border: 1px solid #2a5a2a; }

    .container { max-width: 1400px; margin: 0 auto; padding: 1rem; display: grid; grid-template-columns: 340px 1fr; gap: 1rem; height: calc(100vh - 52px); }

    .panel { background: #141414; border: 1px solid #222; border-radius: 10px; padding: 1rem; display: flex; flex-direction: column; overflow: hidden; }
    .panel-title { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #666; margin-bottom: 0.75rem; }

    /* Left sidebar */
    .sidebar { gap: 0.75rem; overflow-y: auto; }

    .dropzone { border: 2px dashed #333; border-radius: 8px; padding: 1.5rem 1rem; text-align: center; cursor: pointer; transition: all 0.2s; background: #0f0f0f; }
    .dropzone:hover { border-color: #6366f1; background: #111118; }
    .dropzone-icon { font-size: 1.8rem; margin-bottom: 0.4rem; }
    .dropzone-text { font-size: 0.8rem; color: #666; }

    .file-info { background: #0f0f0f; border: 1px solid #222; border-radius: 8px; padding: 0.75rem; display: none; }
    .file-name { font-size: 0.85rem; font-weight: 600; color: #fff; word-break: break-all; }
    .file-meta { font-size: 0.7rem; color: #666; margin-top: 0.25rem; }
    .progress-bar { height: 3px; background: #222; border-radius: 2px; margin-top: 0.5rem; overflow: hidden; }
    .progress-fill { height: 100%; background: #6366f1; width: 0%; transition: width 0.3s; }
    .file-badge { display: inline-block; font-size: 0.6rem; font-weight: 700; padding: 0.15rem 0.4rem; border-radius: 3px; margin-top: 0.4rem; text-transform: uppercase; }
    .badge-pending { background: #332800; color: #fbbf24; border: 1px solid #554400; }
    .badge-ready { background: #1a3a1a; color: #4ade80; border: 1px solid #2a5a2a; }
    .badge-processing { background: #1a1a3a; color: #818cf8; border: 1px solid #2a2a5a; }

    .btn-row { display: flex; gap: 0.5rem; }
    .btn { flex: 1; padding: 0.55rem; border: none; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-upload { background: #1f1f1f; color: #ccc; border: 1px solid #333; }
    .btn-upload:hover:not(:disabled) { background: #2a2a2a; }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #5558e6; }

    .doc-list { margin-top: 0.5rem; }
    .doc-list-title { font-size: 0.65rem; color: #555; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.4rem; }

    /* Right panel */
    .main-area { display: grid; grid-template-rows: auto 1fr; gap: 1rem; }

    /* Summary section */
    .summary-box { background: #0f0f0f; border: 1px solid #1e1e1e; border-radius: 8px; padding: 1rem; max-height: 280px; overflow-y: auto; }
    .summary-placeholder { color: #444; font-style: italic; font-size: 0.85rem; }
    .summary-text { font-size: 0.85rem; line-height: 1.7; }
    .summary-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    .copy-btn { background: #1a1a1a; border: 1px solid #2a2a2a; color: #888; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.65rem; cursor: pointer; }
    .copy-btn:hover { background: #222; color: #fff; }

    /* Chat section */
    .chat-area { display: flex; flex-direction: column; overflow: hidden; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 0.5rem 0; display: flex; flex-direction: column; gap: 0.5rem; }
    .msg { max-width: 85%; padding: 0.6rem 0.8rem; border-radius: 8px; font-size: 0.85rem; line-height: 1.5; word-break: break-word; }
    .msg-user { align-self: flex-end; background: #1e3a8a; border: 1px solid #2563eb; border-bottom-right-radius: 2px; }
    .msg-ai { align-self: flex-start; background: #1a1a1a; border: 1px solid #2a2a2a; border-bottom-left-radius: 2px; }
    .msg-label { font-size: 0.6rem; color: #666; margin-top: 0.2rem; }
    .chat-empty { text-align: center; color: #333; font-size: 0.8rem; padding: 2rem 0; }

    .chat-input-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; border-top: 1px solid #1e1e1e; padding-top: 0.5rem; }
    .chat-input-row input { flex: 1; background: #0f0f0f; border: 1px solid #222; border-radius: 6px; padding: 0.5rem 0.75rem; color: #fff; font-size: 0.85rem; outline: none; }
    .chat-input-row input:focus { border-color: #6366f1; }
    .chat-input-row input::placeholder { color: #444; }

    .typing { color: #818cf8; font-size: 0.75rem; padding: 0.3rem 0; display: none; }
    .typing.active { display: block; }

    .toast { position: fixed; bottom: 1rem; right: 1rem; padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.8rem; color: #fff; z-index: 100; animation: fadeIn 0.2s; }
    .toast-ok { background: #166534; } .toast-err { background: #991b1b; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }

    @media (max-width: 900px) { .container { grid-template-columns: 1fr; height: auto; } }
    @media (max-width: 480px) { .container { padding: 0.5rem; } .summary-box { max-height: 200px; } }
  </style>
</head>
<body>

<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
  <h1>Document Analyzer</h1>
  <span class="header-badge" id="statusBadge">Ready</span>
</header>

<div class="container">
  <!-- LEFT: Sidebar -->
  <div class="panel sidebar">
    <div class="panel-title">Upload Document</div>

    <label class="dropzone" id="dropzone">
      <input type="file" id="fileInput" accept="application/pdf" hidden>
      <div class="dropzone-icon">📄</div>
      <div class="dropzone-text">Drop PDF here or click to browse</div>
    </label>

    <div class="file-info" id="fileInfo">
      <div class="file-name" id="fileName"></div>
      <div class="file-meta" id="fileMeta"></div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span class="file-badge badge-pending" id="fileBadge">Pending</span>
    </div>

    <div class="btn-row">
      <button class="btn btn-upload" id="btnUpload">Upload</button>
      <button class="btn btn-primary" id="btnSummarize" disabled>Summarize</button>
    </div>

    <div class="panel-title" style="margin-top:0.75rem">LLM Provider</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem">
      <select id="providerSelect" style="width:100%;background:#0f0f0f;border:1px solid #222;border-radius:6px;padding:0.4rem;color:#fff;font-size:0.75rem;outline:none" disabled><option>Loading...</option></select>
      <select id="modelSelect" style="width:100%;background:#0f0f0f;border:1px solid #222;border-radius:6px;padding:0.4rem;color:#fff;font-size:0.75rem;outline:none" disabled><option>Loading...</option></select>
    </div>
  </div>

  <!-- RIGHT: Main -->
  <div class="main-area">
    <!-- Summary -->
    <div class="panel">
      <div class="summary-header">
        <div class="panel-title" style="margin-bottom:0">Document Summary</div>
        <button class="copy-btn" id="copyBtn" style="display:none">Copy</button>
      </div>
      <div class="summary-box" id="summaryBox">
        <div class="summary-placeholder">Upload a PDF and click Summarize to see the overview here</div>
      </div>
    </div>

    <!-- Chat -->
    <div class="panel chat-area">
      <div class="panel-title">Ask Questions</div>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-empty" id="chatEmpty">Ask a question about your document</div>
      </div>
      <div class="typing" id="typing">AI is thinking...</div>
      <div class="chat-input-row">
        <input id="chatInput" placeholder="Ask about the document..." disabled>
        <button class="btn btn-primary" id="btnAsk" style="flex:none;width:70px;" disabled>Ask</button>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const API = '/api/v1';
let selectedFile = null, currentDocId = null, sessionId = null;

const toast = (msg, ok=true) => { const el=document.createElement('div'); el.className=`toast ${ok?'toast-ok':'toast-err'}`; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),3000); };
const fmt = b => { const s=['B','KB','MB']; let i=0; while(b>=1024){b/=1024;i++;} return b.toFixed(1)+' '+s[i]; };

// Load LLM providers
let providers = [];
async function loadModels() {
  try {
    const res = await fetch(API + '/models');
    const data = await res.json();
    providers = data.providers || [];
    const ps = $('providerSelect');
    ps.innerHTML = '';
    providers.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id; opt.textContent = p.label + (p.available ? '' : ' (no key)');
      opt.disabled = !p.available; ps.appendChild(opt);
    });
    if (data.default) ps.value = data.default.provider;
    ps.disabled = false;
    updateModels();
    if (data.default) $('modelSelect').value = data.default.model;
  } catch(e) { console.error('Models load failed', e); }
}
function updateModels() {
  const pid = $('providerSelect').value;
  const prov = providers.find(p => p.id === pid);
  const ms = $('modelSelect'); ms.innerHTML = '';
  if (prov && prov.models) {
    prov.models.forEach(m => { const o = document.createElement('option'); o.value = m.id; o.textContent = m.label; ms.appendChild(o); });
  }
  ms.disabled = false;
}
$('providerSelect').addEventListener('change', updateModels);
loadModels();

// File selection
$('dropzone').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', e => { if(e.target.files[0]) pickFile(e.target.files[0]); });
$('dropzone').addEventListener('dragover', e => e.preventDefault());
$('dropzone').addEventListener('drop', e => { e.preventDefault(); if(e.dataTransfer.files[0]) pickFile(e.dataTransfer.files[0]); });

function pickFile(file) {
  if(file.type !== 'application/pdf') return toast('Only PDF files are supported', false);
  selectedFile = file; currentDocId = null; sessionId = null;
  $('fileInfo').style.display = 'block';
  $('fileName').textContent = file.name;
  $('fileMeta').textContent = fmt(file.size);
  $('fileBadge').className = 'file-badge badge-pending'; $('fileBadge').textContent = 'Pending';
  $('progressFill').style.width = '0%';
  $('btnSummarize').disabled = true; $('btnAsk').disabled = true; $('chatInput').disabled = true;
}

// Upload
$('btnUpload').addEventListener('click', async () => {
  if(!selectedFile) return toast('Select a PDF first', false);
  $('btnUpload').disabled = true; $('statusBadge').textContent = 'Uploading...';
  $('fileBadge').className = 'file-badge badge-processing'; $('fileBadge').textContent = 'Uploading';
  try {
    const fd = new FormData(); fd.append('file', selectedFile);
    const res = await fetch(`${API}/upload`, { method:'POST', body:fd });
    if(!res.ok) throw new Error('Upload failed');
    const data = await res.json();
    currentDocId = data.doc_id;
    $('progressFill').style.width = '100%';
    $('fileBadge').className = 'file-badge badge-processing'; $('fileBadge').textContent = 'Processing';
    $('statusBadge').textContent = 'Processing...';
    toast('Uploaded! Processing document...');
    pollStatus();
  } catch(e) { toast(e.message, false); $('statusBadge').textContent = 'Error'; }
  finally { $('btnUpload').disabled = false; }
});

async function pollStatus() {
  if(!currentDocId) return;
  try {
    const res = await fetch(`${API}/documents/${currentDocId}/status`);
    const data = await res.json();
    if(data.status === 'completed') {
      $('fileBadge').className = 'file-badge badge-ready'; $('fileBadge').textContent = 'Ready';
      $('statusBadge').textContent = 'Ready';
      $('btnSummarize').disabled = false; $('btnAsk').disabled = false; $('chatInput').disabled = false;
      toast('Document processed!');
    } else if(data.status === 'failed') {
      $('fileBadge').textContent = 'Failed'; toast('Processing failed', false);
    } else {
      setTimeout(pollStatus, 2000);
    }
  } catch { setTimeout(pollStatus, 3000); }
}

// Summarize
$('btnSummarize').addEventListener('click', async () => {
  if(!currentDocId) return;
  $('btnSummarize').disabled = true; $('statusBadge').textContent = 'Summarizing...';
  $('summaryBox').innerHTML = '<div class="summary-placeholder">Generating summary...</div>';
  try {
    const res = await fetch(`${API}/summarize/${currentDocId}?provider=${$('providerSelect').value}&model=${$('modelSelect').value}`, { method:'POST', headers:{'Content-Type':'application/json'} });
    const data = await res.json();
    if (!res.ok || !data.summary) {
      $('summaryBox').innerHTML = `<div style="color:#f87171">${data.detail || 'Summarization failed. Check API keys in Render.'}</div>`;
      $('statusBadge').textContent = 'Error';
      return;
    }
    $('summaryBox').innerHTML = `<div class="summary-text">${formatText(data.summary)}</div>`;
    $('copyBtn').style.display = 'block';
    $('statusBadge').textContent = 'Ready';
    toast('Summary generated!');
  } catch(e) { $('summaryBox').innerHTML = `<div style="color:#f87171">${e.message}</div>`; }
  finally { $('btnSummarize').disabled = false; }
});

$('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText($('summaryBox').innerText).then(() => {
    $('copyBtn').textContent = 'Copied!'; setTimeout(() => $('copyBtn').textContent = 'Copy', 1500);
  });
});

// Chat
$('btnAsk').addEventListener('click', sendQuestion);
$('chatInput').addEventListener('keydown', e => { if(e.key==='Enter') sendQuestion(); });

async function sendQuestion() {
  const q = $('chatInput').value.trim(); if(!q || !currentDocId) return;
  $('chatEmpty').style.display = 'none';
  addMsg('user', q); $('chatInput').value = '';
  $('typing').classList.add('active'); $('btnAsk').disabled = true;
  try {
    const res = await fetch(`${API}/query`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ query: q, provider: $('providerSelect').value, model: $('modelSelect').value })
    });
    const data = await res.json();
    addMsg('ai', data.answer || data.detail || 'No response from AI');
    if(data.session_id) sessionId = data.session_id;
  } catch(e) { addMsg('ai', 'Something went wrong: ' + e.message); }
  finally { $('typing').classList.remove('active'); $('btnAsk').disabled = false; $('chatInput').focus(); }
}

function addMsg(role, text) {
  const el = document.createElement('div');
  el.innerHTML = `<div class="msg ${role==='user'?'msg-user':'msg-ai'}">${formatText(text)}</div><div class="msg-label" style="text-align:${role==='user'?'right':'left'}">${role==='user'?'You':'AI'}</div>`;
  $('chatMessages').appendChild(el);
  $('chatMessages').scrollTop = $('chatMessages').scrollHeight;
}

function formatText(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/^\s*[-•]\s+(.+)$/gm,'<li>$1</li>')
    .replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>')
    .replace(/^/,'<p>').replace(/$/,'</p>');
}
</script>
</body>
</html>
